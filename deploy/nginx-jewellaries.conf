# Aurum Rosso. Only answers for its own hostnames, so the other sites on this
# server (and requests to the bare IP) are unaffected. Add the real domain to
# server_name when it's pointed here.
limit_req_zone $binary_remote_addr zone=aurum_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name 13-140-153-170.sslip.io;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # rendered product images + videos straight from disk (supports range requests for video seeking)
    location /media/ {
        alias /var/www/jewellaries/apps/web/public/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=aurum_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
