# Jewellariess (jewellariess.com), behind Cloudflare (SSL mode: Full strict).
# Only answers for its own hostnames, so other sites on this server (and
# requests to the bare IP over port 80) are unaffected.
limit_req_zone $binary_remote_addr zone=aurum_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aurum_auth:10m rate=5r/m;

# HTTP: ACME challenges, everything else to https://jewellariess.com
server {
    listen 80;
    listen [::]:80;
    server_name jewellariess.com www.jewellariess.com 13-140-153-170.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt-jewellariess; }
    location / { return 301 https://jewellariess.com$request_uri; }
}

# Reject TLS for hostnames this server doesn't serve (no cert leakage to strangers).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jewellariess.com;
    ssl_certificate /etc/letsencrypt/live/jewellariess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jewellariess.com/privkey.pem;
    return 301 https://jewellariess.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jewellariess.com;

    ssl_certificate /etc/letsencrypt/live/jewellariess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jewellariess.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jewellariess_ssl:10m;

    # Real visitor IPs from Cloudflare (for logs and rate limits).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt-jewellariess; }

    # Apple Pay domain verification (Paystack). File lives in the repo: deploy/well-known/
    location = /.well-known/apple-developer-merchantid-domain-association {
        alias /var/www/jewellaries/deploy/well-known/apple-developer-merchantid-domain-association;
        default_type text/plain;
    }

    # rendered product images + videos straight from disk (range requests for video seeking)
    location /media/ {
        alias /var/www/jewellaries/apps/web/public/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Sign-in endpoints go straight to the Rust API (cookies + redirects), tightly rate limited.
    location ~ ^/api/auth/(email|google/start)$ {
        limit_req zone=aurum_auth burst=5 nodelay;
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=aurum_api burst=30 nodelay;
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
