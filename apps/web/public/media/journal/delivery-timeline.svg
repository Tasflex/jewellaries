<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="From order to doorstep">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">SHIPPING</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >From order to doorstep</text>
<circle cx="120" cy="215" r="20" fill="#d4af37"/>
<line x1="142" y1="215" x2="418" y2="215" stroke="#9a7a28" stroke-width="4"/>
<text x="120" y="270" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="middle" >Order placed</text>
<text x="120" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="middle" >Day 0</text>
<circle cx="440" cy="215" r="20" fill="#d4af37"/>
<line x1="462" y1="215" x2="738" y2="215" stroke="#9a7a28" stroke-width="4"/>
<text x="440" y="270" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="middle" >Prepared &amp; dispatched</text>
<text x="440" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="middle" >1–3 business days</text>
<circle cx="760" cy="215" r="20" fill="#d4af37"/>
<line x1="782" y1="215" x2="1058" y2="215" stroke="#9a7a28" stroke-width="4"/>
<text x="760" y="270" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="middle" >In transit, tracked</text>
<text x="760" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="middle" >See your region below</text>
<circle cx="1080" cy="215" r="20" fill="#d4af37"/>
<text x="1080" y="270" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="middle" >Delivered</text>
<text x="1080" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="middle" >Signature red box</text>
<rect x="60" y="340" width="1080" height="250" rx="18" fill="#efe7d8"/>
<text x="90" y="380" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6d645c" text-anchor="start" >Transit after dispatch (business days)</text>
<text x="90" y="425" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1b1716" text-anchor="start" >North America</text>
<text x="540" y="425" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >6–10</text>
<text x="630" y="425" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1b1716" text-anchor="start" >Europe &amp; UK</text>
<text x="1080" y="425" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >7–12</text>
<text x="90" y="471" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1b1716" text-anchor="start" >Gulf</text>
<text x="540" y="471" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >7–12</text>
<text x="630" y="471" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1b1716" text-anchor="start" >Oceania</text>
<text x="1080" y="471" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >8–14</text>
<text x="90" y="517" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1b1716" text-anchor="start" >Africa</text>
<text x="540" y="517" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >9–16</text>
