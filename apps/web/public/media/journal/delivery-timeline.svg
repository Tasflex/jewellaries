<text x="1080" y="517" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >10–18</text>
<text x="90" y="563" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1b1716" text-anchor="start" >Express (most countries)</text>
<text x="540" y="563" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1716" text-anchor="end" >4–7</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
