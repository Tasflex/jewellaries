<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Four kinds of gold finish, cut in half">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">MATERIALS</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Four kinds of gold finish, cut in half</text>
<text x="60" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Gold-plated</text>
<text x="60" y="247" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="start" >A very thin layer of gold over brass or copper</text>
<rect x="640" y="183" width="500" height="6" rx="4" fill="#d4af37"/>
<rect x="640" y="189" width="500" height="74" rx="4" fill="#b07a45" opacity="0.85"/>
<text x="660" y="233.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start" >Base metal: brass / copper</text>
<text x="60" y="333" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Gold vermeil</text>
<text x="60" y="365" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="start" >At least 2.5 microns of 10k+ gold over sterling silver (US rule)</text>
<rect x="640" y="301" width="500" height="18" rx="4" fill="#d4af37"/>
<rect x="640" y="319" width="500" height="62" rx="4" fill="#c9c9cf" opacity="0.85"/>
<text x="660" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1716" text-anchor="start" >Base metal: sterling silver</text>
<text x="60" y="451" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Gold-filled</text>
<text x="60" y="483" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="start" >A thick sheet of gold bonded on: at least 1/20 of the weight</text>
<rect x="640" y="419" width="500" height="34" rx="4" fill="#d4af37"/>
<rect x="640" y="453" width="500" height="46" rx="4" fill="#b07a45" opacity="0.85"/>
<text x="660" y="483.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start" >Base metal: brass</text>
<text x="60" y="569" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >PVD gold</text>
<text x="60" y="601" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="start" >A hard, vacuum-bonded gold layer over 316L stainless steel</text>
<rect x="640" y="537" width="500" height="14" rx="4" fill="#d4af37"/>
<rect x="640" y="551" width="500" height="66" rx="4" fill="#9ea3a8" opacity="0.85"/>
<text x="660" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start" >Base metal: 316L steel</text>
<text x="640" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" >Gold layer (not to scale)</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
</svg>