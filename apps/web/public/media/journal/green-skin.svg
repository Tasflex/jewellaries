<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Why some jewellery turns skin green">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">CARE &amp; MATERIALS</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Why some jewellery turns skin green</text>
<rect x="60" y="175" width="330" height="230" rx="18" fill="#efe7d8"/>
<text x="86" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Copper in the metal</text>
<text x="86" y="275" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >Brass and cheap alloys</text>
<text x="86" y="305" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >contain copper, often under</text>
<text x="86" y="335" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >a thin plating.</text>
<path d="M400 290 l22 0 m-10 -10 l10 10 l-10 10" stroke="#9a7a28" stroke-width="4" fill="none"/>
<rect x="430" y="175" width="330" height="230" rx="18" fill="#efe7d8"/>
<text x="456" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Meets sweat &amp; lotion</text>
<text x="456" y="275" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >Acids and salts on skin</text>
<text x="456" y="305" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >react with copper once</text>
<text x="456" y="335" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >plating wears through.</text>
<path d="M770 290 l22 0 m-10 -10 l10 10 l-10 10" stroke="#9a7a28" stroke-width="4" fill="none"/>
<rect x="800" y="175" width="330" height="230" rx="18" fill="#efe7d8"/>
<text x="826" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Copper salts form</text>
<text x="826" y="275" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >The reaction leaves a</text>
<text x="826" y="305" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >harmless green film on the</text>
<text x="826" y="335" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >skin.</text>
<rect x="60" y="440" width="1080" height="150" rx="18" fill="#1b1716"/>
<text x="90" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#d4af37" text-anchor="start" >How to avoid it</text>
<text x="90" y="545" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >Choose a copper-free base (316L stainless steel, sterling silver, solid gold), keep lotion off the metal,</text>
<text x="90" y="575" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >and take pieces off for the pool and the gym. A green mark washes off with soap and water.</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
</svg>