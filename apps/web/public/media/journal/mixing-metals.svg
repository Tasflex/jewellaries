<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Four rules for mixing gold and silver">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">STYLE</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Four rules for mixing gold and silver</text>
<rect x="60" y="170" width="525" height="195" rx="18" fill="#efe7d8"/>
<circle cx="120" cy="232" r="26" fill="#d4af37"/><circle cx="155" cy="232" r="26" fill="#c9c9cf" opacity="0.95"/>
<text x="205" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Pick a lead metal</text>
<text x="100" y="310" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >Let one tone take about two-thirds of the look.</text>
<rect x="605" y="170" width="525" height="195" rx="18" fill="#efe7d8"/>
<circle cx="665" cy="232" r="26" fill="#d4af37"/><circle cx="700" cy="232" r="26" fill="#c9c9cf" opacity="0.95"/>
<text x="750" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Repeat each metal twice</text>
<text x="645" y="310" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >A single odd piece looks accidental; two look chosen.</text>
<rect x="60" y="385" width="525" height="195" rx="18" fill="#efe7d8"/>
<circle cx="120" cy="447" r="26" fill="#d4af37"/><circle cx="155" cy="447" r="26" fill="#c9c9cf" opacity="0.95"/>
<text x="205" y="457" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Use a bridge</text>
<text x="100" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >A two-tone piece or a crystal links gold and silver.</text>
<rect x="605" y="385" width="525" height="195" rx="18" fill="#efe7d8"/>
<circle cx="665" cy="447" r="26" fill="#d4af37"/><circle cx="700" cy="447" r="26" fill="#c9c9cf" opacity="0.95"/>
<text x="750" y="457" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1716" text-anchor="start" >Match the finish</text>
<text x="645" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6d645c" text-anchor="start" >Polished with polished reads cleaner than polished with matte.</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
</svg>