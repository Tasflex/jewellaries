<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Buying a gift without knowing their size">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">GIFTING</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Buying a gift without knowing their size</text>
<rect x="60" y="170" width="1080" height="90" rx="16" fill="#efe7d8"/>
<text x="90" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Necklaces</text>
<rect x="300" y="194" width="150" height="42" rx="21" fill="#d4af37" stroke="#9a7a28" stroke-width="2"/>
<text x="375" y="222" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1716" text-anchor="middle" >Safest bet</text>
<text x="480" y="223" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Extenders give 5 cm of play. 45 cm suits almost everyone.</text>
<rect x="60" y="275" width="1080" height="90" rx="16" fill="#efe7d8"/>
<text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Earrings</text>
<rect x="300" y="299" width="150" height="42" rx="21" fill="#d4af37" stroke="#9a7a28" stroke-width="2"/>
<text x="375" y="327" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1716" text-anchor="middle" >Safe</text>
<text x="480" y="328" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >No size at all. Check their ears are pierced first.</text>
<rect x="60" y="380" width="1080" height="90" rx="16" fill="#efe7d8"/>
<text x="90" y="435" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Bracelets</text>
<rect x="300" y="404" width="150" height="42" rx="21" fill="#d4af37" stroke="#9a7a28" stroke-width="2"/>
<text x="375" y="432" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1716" text-anchor="middle" >Safe</text>
<text x="480" y="433" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Pick an extender chain or an adjustable open cuff.</text>
<rect x="60" y="485" width="1080" height="90" rx="16" fill="#efe7d8"/>
<text x="90" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="start" >Rings</text>
<rect x="300" y="509" width="150" height="42" rx="21" fill="#f7f3ea" stroke="#9a7a28" stroke-width="2"/>
<text x="375" y="537" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1716" text-anchor="middle" >Riskier</text>
<text x="480" y="538" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Borrow a ring they already wear and match its inside size.</text>
<text x="60" y="615" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6d645c" text-anchor="start" >Whatever you choose, unworn pieces can be returned within 30 days (earrings unopened).</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
