<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Find your ring size with a strip of paper">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">SIZE &amp; FIT</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Find your ring size with a strip of paper</text>
<rect x="60" y="170" width="255" height="400" rx="18" fill="#efe7d8"/>
<circle cx="110" cy="225" r="28" fill="#d4af37"/>
<text x="110" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="middle" >1</text>
<text x="88" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1716" text-anchor="start" >Wrap</text>
<text x="88" y="345" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >Wrap a thin strip of</text>
<text x="88" y="375" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >paper around the base</text>
<text x="88" y="405" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >of the finger. Snug,</text>
<text x="88" y="435" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >not tight.</text>
<rect x="335" y="170" width="255" height="400" rx="18" fill="#efe7d8"/>
<circle cx="385" cy="225" r="28" fill="#d4af37"/>
<text x="385" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="middle" >2</text>
<text x="363" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1716" text-anchor="start" >Mark</text>
<text x="363" y="345" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >Mark where the paper</text>
<text x="363" y="375" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >overlaps. Check it</text>
<text x="363" y="405" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >slides over the</text>
<text x="363" y="435" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >knuckle.</text>
<rect x="610" y="170" width="255" height="400" rx="18" fill="#efe7d8"/>
<circle cx="660" cy="225" r="28" fill="#d4af37"/>
<text x="660" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="middle" >3</text>
<text x="638" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1716" text-anchor="start" >Measure</text>
<text x="638" y="345" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >Lay it flat and</text>
<text x="638" y="375" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >measure to the mark</text>
<text x="638" y="405" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >in mm. That&#x27;s the</text>
<text x="638" y="435" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >circumference.</text>
<rect x="885" y="170" width="255" height="400" rx="18" fill="#efe7d8"/>
<circle cx="935" cy="225" r="28" fill="#d4af37"/>
<text x="935" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b1716" text-anchor="middle" >4</text>
<text x="913" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1716" text-anchor="start" >Divide</text>
<text x="913" y="345" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >Divide by 3.14 for</text>
<text x="913" y="375" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >the diameter, then</text>
<text x="913" y="405" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >match it on the size</text>
<text x="913" y="435" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6d645c" text-anchor="start" >chart.</text>
<text x="60" y="615" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1b1716" text-anchor="start" >Example: 54.4 mm ÷ 3.14 = 17.3 mm, which is a US size 7. Measure twice, at the end of the day.</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
</svg>