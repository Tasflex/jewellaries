<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Store jewellery so it stays bright">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">CARE &amp; MATERIALS</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Store jewellery so it stays bright</text>
<rect x="60" y="165" width="525" height="430" rx="18" fill="#efe7d8"/>
<rect x="615" y="165" width="525" height="430" rx="18" fill="#efe7d8"/>
<text x="90" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#9a7a28" text-anchor="start" >Do</text>
<text x="645" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1716" text-anchor="start" >Avoid</text>
<circle cx="100" cy="262" r="10" fill="#d4af37"/>
<text x="125" y="270" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Give each piece its own pouch or compartment</text>
<circle cx="100" cy="330" r="10" fill="#d4af37"/>
<text x="125" y="338" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Hang chains, or lay them flat with clasps closed</text>
<circle cx="100" cy="398" r="10" fill="#d4af37"/>
<text x="125" y="406" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Keep it dry: not on a steamy bathroom shelf</text>
<circle cx="100" cy="466" r="10" fill="#d4af37"/>
<text x="125" y="474" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Add an anti-tarnish strip to the box</text>
<circle cx="100" cy="534" r="10" fill="#d4af37"/>
<text x="125" y="542" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Store pearls flat, never hanging</text>
<line x1="648" y1="254" x2="664" y2="270" stroke="#1b1716" stroke-width="3"/><line x1="664" y1="254" x2="648" y2="270" stroke="#1b1716" stroke-width="3"/>
<text x="682" y="270" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Piling everything into one dish</text>
<line x1="648" y1="322" x2="664" y2="338" stroke="#1b1716" stroke-width="3"/><line x1="664" y1="322" x2="648" y2="338" stroke="#1b1716" stroke-width="3"/>
<text x="682" y="338" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Leaving chains coiled and clasps open</text>
<line x1="648" y1="390" x2="664" y2="406" stroke="#1b1716" stroke-width="3"/><line x1="664" y1="390" x2="648" y2="406" stroke="#1b1716" stroke-width="3"/>
<text x="682" y="406" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Storing pieces still damp from the shower</text>
<line x1="648" y1="458" x2="664" y2="474" stroke="#1b1716" stroke-width="3"/><line x1="664" y1="458" x2="648" y2="474" stroke="#1b1716" stroke-width="3"/>
<text x="682" y="474" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Plastic bags for pearls (they need air)</text>
<line x1="648" y1="526" x2="664" y2="542" stroke="#1b1716" stroke-width="3"/><line x1="664" y1="526" x2="648" y2="542" stroke="#1b1716" stroke-width="3"/>
<text x="682" y="542" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1716" text-anchor="start" >Hard stones loose next to plated metal</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
</svg>