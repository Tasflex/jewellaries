<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Clean plated and crystal jewellery safely">
<rect width="1200" height="675" rx="28" fill="#f7f3ea"/>
<rect x="18" y="18" width="1164" height="639" rx="20" fill="none" stroke="#d9cdb4" stroke-width="2"/>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a7a28" text-anchor="start" letter-spacing="3">CARE &amp; MATERIALS</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1b1716" text-anchor="start" >Clean plated and crystal jewellery safely</text>
<circle cx="95" cy="202" r="26" fill="#d4af37"/>
<text x="95" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b1716" text-anchor="middle" >1</text>
<text x="140" y="200" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1b1716" text-anchor="start" >Warm water + a drop of mild soap</text>
<text x="140" y="230" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6d645c" text-anchor="start" >Unscented washing-up liquid is ideal.</text>
<circle cx="95" cy="294" r="26" fill="#d4af37"/>
<text x="95" y="303" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b1716" text-anchor="middle" >2</text>
<text x="140" y="292" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1b1716" text-anchor="start" >Soak for 2–3 minutes</text>
<text x="140" y="322" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6d645c" text-anchor="start" >Loosens lotion and skin oils around stones.</text>
<circle cx="95" cy="386" r="26" fill="#d4af37"/>
<text x="95" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b1716" text-anchor="middle" >3</text>
<text x="140" y="384" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1b1716" text-anchor="start" >Soft brush or cloth</text>
<text x="140" y="414" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6d645c" text-anchor="start" >A baby toothbrush gets behind crystal settings.</text>
<circle cx="95" cy="478" r="26" fill="#d4af37"/>
<text x="95" y="487" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b1716" text-anchor="middle" >4</text>
<text x="140" y="476" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1b1716" text-anchor="start" >Rinse, then pat dry</text>
<text x="140" y="506" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6d645c" text-anchor="start" >Dry fully before you store it.</text>
<rect x="700" y="170" width="440" height="410" rx="18" fill="#1b1716"/>
<text x="730" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#d4af37" text-anchor="start" >Never use on plating</text>
<text x="730" y="275" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >×  Toothpaste or baking soda</text>
<text x="730" y="325" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >×  Bleach or chlorine</text>
<text x="730" y="375" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >×  Silver dips</text>
<text x="730" y="425" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >×  Ultrasonic cleaners</text>
<text x="730" y="475" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >×  Polishing cloths with compound</text>
<text x="730" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#f7f3ea" text-anchor="start" >×  Alcohol or acetone</text>
<text x="60" y="620" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6d645c" text-anchor="start" >Pearls: skip the soak. Wipe with a soft damp cloth only.</text>
<text x="1140" y="635" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6d645c" text-anchor="end" >jewellariess.com</text>
</svg>